<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IPShow</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="panel">
      <header class="hero">
        <div>
          <p class="eyebrow">当前公网 IP</p>
          <h1 id="ip-value">加载中...</h1>
        </div>
        <button id="refresh-button" class="ghost-button" type="button">刷新</button>
      </header>

      <section id="status-banner" class="status-banner hidden"></section>

      <section class="grid">
        <article class="card">
          <span class="label">国家</span>
          <span id="country-value" class="value">-</span>
        </article>
        <article class="card">
          <span class="label">地区</span>
          <span id="region-value" class="value">-</span>
        </article>
        <article class="card">
          <span class="label">城市</span>
          <span id="city-value" class="value">-</span>
        </article>
        <article class="card">
          <span class="label">邮编</span>
          <span id="postal-value" class="value">-</span>
        </article>
        <article class="card">
          <span class="label">运营商</span>
          <span id="isp-value" class="value">-</span>
        </article>
        <article class="card">
          <span class="label">时区</span>
          <span id="timezone-value" class="value">-</span>
        </article>
        <article class="card">
          <span class="label">纬度</span>
          <span id="latitude-value" class="value">-</span>
        </article>
        <article class="card">
          <span class="label">经度</span>
          <span id="longitude-value" class="value">-</span>
        </article>
      </section>

      <footer class="footer">
        <span id="updated-at" class="updated-at">最近更新：-</span>
        <button id="copy-button" class="primary-button" type="button">复制 IP</button>
      </footer>
    </main>

    <script src="./popup.js"></script>
  </body>
</html>
