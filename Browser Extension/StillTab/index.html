<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="darkreader-lock" content="light">
    <title>StillTab</title>
    <link rel="icon" href="icon/icon16.png" sizes="16x16" type="image/png">
    <link rel="stylesheet" href="css/newtab.css">
  </head>
  <body>
    <main class="page-shell" aria-label="StillTab new tab page">
      <div class="background" id="background"></div>
      <video class="background-video" id="backgroundVideo" muted loop playsinline></video>
      <div class="shade" id="shade"></div>
      <div class="grain" aria-hidden="true"></div>

      <header class="top-line" aria-label="Page controls">
        <div class="corner-actions" aria-label="Page controls">
          <button class="icon-button language-toggle" id="languageToggle" type="button" aria-label="Choose language" aria-expanded="false" aria-controls="languagePanel">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z"></path>
              <path d="M3.6 9h16.8"></path>
              <path d="M3.6 15h16.8"></path>
              <path d="M12 3c2.2 2.46 3.3 5.46 3.3 9S14.2 18.54 12 21"></path>
              <path d="M12 3c-2.2 2.46-3.3 5.46-3.3 9s1.1 6.54 3.3 9"></path>
            </svg>
          </button>

          <button class="icon-button settings-toggle" id="settingsToggle" type="button" aria-label="Open settings" aria-expanded="false" aria-controls="settingsPanel">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.72l-.15.1a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.72l.15-.1a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2Z"></path>
            </svg>
          </button>
        </div>
      </header>

      <section class="hero" aria-label="Search">
        <form class="search-card" id="searchForm" role="search">
          <label class="sr-only" for="searchInput">Search the web</label>
          <input id="searchInput" type="search" autocomplete="off" spellcheck="false" placeholder="Search the Web" data-i18n-placeholder="searchPlaceholder">
          <button class="engine-button" id="engineButton" type="button" aria-label="Choose search engine" aria-expanded="false" aria-controls="engineMenu">
            <img id="engineIcon" alt="" width="20" height="20">
            <span class="engine-fallback" id="engineFallback">B</span>
          </button>
        </form>

        <div class="engine-popover" id="engineMenu" hidden>
          <ul id="engineList"></ul>
        </div>

        <div class="history-popover" id="historyPopover" hidden>
          <div class="history-head">
            <span>Recent searches</span>
            <button type="button" id="clearHistoryButton">Clear history</button>
          </div>
          <ul id="historyList"></ul>
        </div>
      </section>

      <aside class="settings-panel" id="settingsPanel" aria-label="Settings" hidden>
        <header class="panel-header">
          <h1><span id="settingsTitle" data-i18n="settingsTitle">Wallpaper</span></h1>
        </header>

        <section class="settings-group">
          <div class="wallpaper-summary">
            <span id="wallpaperStatus" data-i18n="noFile">No local file selected</span>
          </div>

          <label class="settings-row" for="sourceSelect">
            <span data-i18n="sourceLabel">Source</span>
            <select id="sourceSelect">
              <option value="image" data-i18n-option="sourceImage">Image</option>
              <option value="video" data-i18n-option="sourceVideo">Video</option>
            </select>
          </label>
          <button class="secondary-button primary-action" id="chooseFileButton" type="button" data-i18n="chooseFile">Choose local wallpaper</button>
          <input class="file-input" id="fileInput" type="file" accept="image/*" multiple>
          <div class="local-gallery" id="localGallery"></div>
        </section>

        <section class="settings-group advanced-section" id="advancedSection">
          <h2 data-i18n="searchSection">Search</h2>
          <label class="settings-row" for="engineSelect">
            <span data-i18n="engineLabel">Search engine</span>
            <select id="engineSelect">
              <option value="google">Google</option>
              <option value="bing">Bing</option>
              <option value="duckduckgo">DuckDuckGo</option>
              <option value="baidu">Baidu</option>
            </select>
          </label>
          <div class="custom-engine-editor" aria-label="Custom search engines">
            <label class="settings-row" for="customEngineName">
              <span data-i18n="customName">Custom name</span>
              <input id="customEngineName" type="text" maxlength="24" placeholder="Example" data-i18n-placeholder="customNamePlaceholder">
            </label>
            <label class="settings-row" for="customEngineUrl">
              <span data-i18n="customUrl">Custom URL</span>
              <input id="customEngineUrl" type="url" placeholder="https://example.com/search?q={query}" data-i18n-placeholder="customUrlPlaceholder">
            </label>
            <button class="secondary-button compact-action" id="addCustomEngineButton" type="button" data-i18n="addCustom">Add custom engine</button>
            <ul class="custom-engine-list" id="customEngineList"></ul>
          </div>
          <label class="slider-row" for="overlayRange">
            <span data-i18n="overlayLabel">Overlay</span>
            <input id="overlayRange" type="range" min="15" max="82" value="42">
          </label>
          <label class="slider-row" for="backgroundOpacityRange">
            <span data-i18n="backgroundOpacityLabel">Background opacity</span>
            <input id="backgroundOpacityRange" type="range" min="35" max="100" value="100">
          </label>
        </section>
      </aside>

      <aside class="language-panel" id="languagePanel" aria-label="Language" hidden>
        <header class="language-header"><span data-i18n="languageTitle">Language</span></header>
        <div class="language-options" id="languageOptions"></div>
      </aside>
    </main>

    <script src="js/newtab.js"></script>
  </body>
</html>
