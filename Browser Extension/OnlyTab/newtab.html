<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OnlyTab</title>
    <link rel="stylesheet" href="styles/newtab.css">
  </head>
  <body>
    <main class="tab-shell" aria-label="OnlyTab new tab page" data-i18n-aria="pageLabel">
      <div class="background" id="background"></div>
      <video class="background-video" id="backgroundVideo" muted loop playsinline></video>
      <div class="veil" id="veil"></div>

      <button
        type="button"
        class="settings-icon-button"
        id="settingsButton"
        aria-expanded="false"
        aria-controls="customizePanel"
        aria-label="Open settings"
        data-i18n-aria="openSettings"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 15.5A3.5 3.5 0 1 0 12 8a3.5 3.5 0 0 0 0 7.5Z"/>
          <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.04.04a2 2 0 0 1-2.83 2.83l-.04-.04A1.7 1.7 0 0 0 15 19.36a1.7 1.7 0 0 0-1 .91l-.02.06A2 2 0 0 1 12.14 21h-.28a2 2 0 0 1-1.84-1.22l-.02-.06A1.7 1.7 0 0 0 9 18.82a1.7 1.7 0 0 0-1.87.34l-.04.04a2 2 0 0 1-2.83-2.83l.04-.04A1.7 1.7 0 0 0 4.64 15a1.7 1.7 0 0 0-.91-1l-.06-.02A2 2 0 0 1 3 12.14v-.28a2 2 0 0 1 1.22-1.84l.06-.02A1.7 1.7 0 0 0 5.18 9a1.7 1.7 0 0 0-.34-1.87l-.04-.04a2 2 0 0 1 2.83-2.83l.04.04A1.7 1.7 0 0 0 9 4.64a1.7 1.7 0 0 0 1-.91l.02-.06A2 2 0 0 1 11.86 3h.28a2 2 0 0 1 1.84 1.22l.02.06A1.7 1.7 0 0 0 15 5.18a1.7 1.7 0 0 0 1.87-.34l.04-.04a2 2 0 0 1 2.83 2.83l-.04.04A1.7 1.7 0 0 0 19.36 9c.2.43.54.78.97.99l.06.03A2 2 0 0 1 21 11.86v.28a2 2 0 0 1-1.22 1.84l-.06.02c-.43.2-.78.54-.99.97Z"/>
        </svg>
      </button>

      <section class="status-bar" aria-label="Current conditions" data-i18n-aria="conditionsLabel">
        <div class="weather-block">
          <div class="location" id="locationText"></div>
          <div class="weather-row">
            <span class="sun-icon" aria-hidden="true"></span>
            <strong id="temperatureText">28&deg;C</strong>
          </div>
        </div>
        <div class="divider" aria-hidden="true"></div>
        <div class="time-block">
          <time class="clock" id="clockText"></time>
          <div class="date" id="dateText"></div>
        </div>
      </section>

      <section class="search-area" aria-label="Search" data-i18n-aria="searchLabel">
        <form class="search-wrap" id="searchForm" role="search" aria-label="Search" data-i18n-aria="searchLabel">
          <label class="sr-only" for="searchInput" data-i18n="searchLabel">Search</label>
          <input id="searchInput" type="search" autocomplete="off" spellcheck="false" placeholder="">
        </form>

        <div class="search-history" id="searchHistoryPanel" hidden>
          <div class="history-header">
            <span data-i18n="historyTitle">Recent Searches</span>
            <button type="button" id="clearHistoryButton" data-i18n="clearHistory">Clear All</button>
          </div>
          <ul id="searchHistoryList" aria-label="Recent searches" data-i18n-aria="historyTitle"></ul>
        </div>
      </section>

      <aside class="customize-panel closed" id="customizePanel" aria-label="Settings" data-i18n-aria="panelTitle">
        <header class="panel-header">
          <h1 data-i18n="panelTitle">Settings</h1>
        </header>

        <section class="setting-group" aria-labelledby="generalTitle">
          <h2 id="generalTitle" data-i18n="generalTitle">General</h2>
          <label class="field-row" for="languageSelect">
            <span data-i18n="languageLabel">Interface Language</span>
            <select id="languageSelect">
              <option value="en-US">English (US)</option>
              <option value="zh-CN">Chinese (Simplified)</option>
            </select>
          </label>
          <label class="field-row" for="engineSelect">
            <span data-i18n="engineLabel">Search Engine</span>
            <select id="engineSelect">
              <option value="bing">Bing</option>
              <option value="google">Google</option>
              <option value="duckduckgo">DuckDuckGo</option>
              <option value="baidu">Baidu</option>
            </select>
          </label>
          <label class="field-row" for="themeSelect">
            <span data-i18n="themeLabel">Theme</span>
            <select id="themeSelect">
              <option value="light" data-i18n="lightTheme">Light</option>
              <option value="dark" data-i18n="darkTheme">Dark</option>
            </select>
          </label>
        </section>

        <section class="setting-group" aria-labelledby="appearanceTitle">
          <h2 id="appearanceTitle" data-i18n="appearanceTitle">Background & Appearance</h2>
          <label class="field-row appearance-row" for="sourceSelect">
            <span data-i18n="sourceLabel">Background Format</span>
            <select id="sourceSelect" data-i18n-aria="sourceLabel" aria-label="Background Format">
              <option value="blank" data-i18n="blankSource">Default</option>
              <option value="image" data-i18n="imageSource">Image</option>
              <option value="video" data-i18n="videoSource">Video</option>
            </select>
          </label>

          <label class="field-stack path-picker" for="pathText">
            <span data-i18n="pathLabel">Current File Path</span>
            <input id="pathText" type="text" readonly value="">
          </label>
          <input id="imageFile" class="file-input" type="file" accept="image/*">

          <label class="field-stack" for="opacityRange">
            <span data-i18n="opacityLabel">Opacity</span>
            <input id="opacityRange" type="range" min="0" max="100" value="56">
            <span class="range-labels"><span>0%</span><span>100%</span></span>
          </label>
        </section>
      </aside>
    </main>

    <script src="scripts/newtab.js"></script>
  </body>
</html>
